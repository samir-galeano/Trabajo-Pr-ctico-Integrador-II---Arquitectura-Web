# Log del gateway en JSON con el mismo request_id que reciben los servicios.
# Copiar en VM-1 a /etc/nginx/conf.d/log_format_json.conf (contexto http) y,
# dentro del server block de api.bookstack.local:
#
#   access_log /var/log/nginx/api.bookstack.local.access.log json_gateway;
#   proxy_set_header X-Request-ID $request_id;
#
log_format json_gateway escape=json
  '{'
    '"timestamp":"$time_iso8601",'
    '"level":"INFO",'
    '"service":"gateway",'
    '"request_id":"$request_id",'
    '"message":"$request_method $uri $status",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"upstream":"$upstream_addr",'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"remote_addr":"$remote_addr"'
  '}';
