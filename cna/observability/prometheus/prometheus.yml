global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Microservicios (nombres DNS de la red cna-net)
  - job_name: search-svc
    static_configs:
      - targets: ["search-svc:8000"]

  - job_name: event-bridge
    static_configs:
      - targets: ["event-bridge:8001"]

  - job_name: audit-svc
    static_configs:
      - targets: ["audit-svc:8002"]

  - job_name: export-svc
    static_configs:
      - targets: ["export-svc:8003"]

  - job_name: media-svc
    static_configs:
      - targets: ["media-svc:8004"]

  # Una entrada por réplica: el DNS de Docker devuelve todas las IP del
  # servicio, así el escalado a 3 workers aparece solo.
  - job_name: export-worker
    dns_sd_configs:
      - names: ["export-worker"]
        type: A
        port: 9101
        refresh_interval: 15s

  # Streams y consumidores de JetStream (profundidad de colas, DLQ)
  - job_name: nats
    static_configs:
      - targets: ["nats-exporter:7777"]
