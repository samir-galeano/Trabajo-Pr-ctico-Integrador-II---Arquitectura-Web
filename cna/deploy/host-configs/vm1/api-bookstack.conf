upstream search_service {
    server 192.168.0.6:8000;
    keepalive 16;
}

upstream media_service {
    server 192.168.0.6:8004;
    keepalive 8;
}

upstream audit_service {
    server 192.168.0.6:8002;
    keepalive 8;
}

upstream export_service {
    server 192.168.0.6:8003;
    keepalive 8;
}

server {
    listen 80;
    server_name api.bookstack.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.bookstack.local;

    ssl_certificate /etc/nginx/ssl/bookstack.crt;
    ssl_certificate_key /etc/nginx/ssl/bookstack.key;

    ssl_protocols TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /v2/media/ {
        limit_req zone=api_limit burst=10 nodelay;
        client_max_body_size 10m;

        proxy_pass http://media_service/media/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @gateway_unavailable;
    }

    location /v2/audit {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://audit_service/audit;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @gateway_unavailable;
    }

    location /v2/exports {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://export_service/exports;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @gateway_unavailable;
    }


    location = /v2/audit/healthz {
        proxy_pass http://audit_service/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }


    location = /v2/audit/readyz {
        proxy_pass http://audit_service/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }


    location = /v2/audit/metrics {
        proxy_pass http://audit_service/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }


    location = /v2/exports/healthz {
        proxy_pass http://export_service/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }


    location = /v2/exports/readyz {
        proxy_pass http://export_service/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }


    location = /v2/exports/metrics {
        proxy_pass http://export_service/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }


    location = /v2/media/healthz {
        proxy_pass http://media_service/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }


    location = /v2/media/readyz {
        proxy_pass http://media_service/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }


    location = /v2/media/metrics {
        proxy_pass http://media_service/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /v2/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://search_service/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @gateway_unavailable;
    }

    location @gateway_unavailable {
        default_type application/json;
        return 503 '{"error":"service_unavailable","message":"El servicio solicitado no está disponible","request_id":"$request_id"}';
    }
}
