openapi: 3.1.0

info:
  title: Audit Service API
  version: 2.0.0
  description: |
    API para consultar el registro de auditoría. audit-svc consume los
    eventos bookstack.page.* desde NATS JetStream (consumidor durable) y los
    guarda en su propio PostgreSQL; event_id es clave primaria, por lo que
    un evento duplicado no genera un segundo registro.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://api.bookstack.local/v2
    description: API Gateway (Nginx, TLS 1.3)

tags:
  - name: Audit
    description: Consulta de eventos y registros de auditoría.

security:
  - BearerAuth: []

paths:
  /audit:
    get:
      tags:
        - Audit
      summary: Consultar registros de auditoría
      operationId: listAuditRecords
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: entity
          in: query
          required: false
          description: Tipo de entidad (page, book, chapter...).
          schema:
            type: string
          example: page
        - name: id
          in: query
          required: false
          description: ID de la entidad en BookStack.
          schema:
            type: string
          example: "25"
        - name: start
          in: query
          required: false
          description: Fecha y hora inicial (inclusive) sobre occurred_at.
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: false
          description: Fecha y hora final (inclusive) sobre occurred_at.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Registros encontrados, del más reciente al más antiguo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRecordList"
              example:
                count: 1
                items:
                  - event_id: 3f0e2b1c-6a7d-4f3e-9b1a-2c5d8e7f6a01
                    type: bookstack.page.updated
                    entity_type: page
                    entity_id: "25"
                    entity_name: Configuración de Nginx
                    actor: Admin
                    occurred_at: "2026-11-15T14:00:00+00:00"
                    request_id: 9c1f6a2e0b7d4e3a8f5c2b1a0d9e8f7c
                    payload:
                      page_id: 25
                      name: Configuración de Nginx
                    received_at: "2026-11-15T14:00:00.412+00:00"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /audit/{event_id}:
    get:
      tags:
        - Audit
      summary: Consultar un registro de auditoría específico
      operationId: getAuditRecord
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Registro encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Token opaco (API key) configurado en API_AUTH_TOKEN, enviado como "Authorization: Bearer <token>". /healthz, /readyz y /metrics no lo requieren; sin token o con uno inválido se responde 401.'

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Identificador de correlación generado por el gateway.
      schema:
        type: string

  responses:
    BadRequest:
      description: Parámetros inválidos (fecha mal formada, limit fuera de rango).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No autenticado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Registro no encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: PostgreSQL no disponible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    AuditRecordList:
      type: object
      required:
        - count
        - items
      properties:
        count:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditRecord"

    AuditRecord:
      type: object
      required:
        - event_id
        - type
      properties:
        event_id:
          type: string
        type:
          type: string
          description: Tipo de evento (bookstack.page.updated, ...).
        entity_type:
          type: string
        entity_id:
          type: string
        entity_name:
          type: string
        actor:
          type: string
          description: Quién realizó la acción en BookStack.
        occurred_at:
          type:
            - string
            - "null"
          format: date-time
        request_id:
          type: string
        payload:
          type: object
          additionalProperties: true
        received_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        detail: {}
