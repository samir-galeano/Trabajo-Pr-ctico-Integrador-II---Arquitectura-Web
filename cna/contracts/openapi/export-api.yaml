
openapi: 3.1.0

info:
  title: Export Service API
  version: 2.0.0
  description: API para solicitar y consultar exportaciones de contenido de BookStack.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: http://localhost:8003/api/v2
    description: Servidor local de desarrollo

tags:
  - name: Exports
    description: Operaciones para generar y consultar exportaciones.

security:
  - BearerAuth: []

paths:
  /exports:
    post:
      tags:
        - Exports
      summary: Solicitar una exportación
      operationId: createExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "202":
          description: Solicitud de exportación aceptada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
        "400":
          description: Solicitud inválida.
        "401":
          description: No autenticado.
        "500":
          description: Error interno del servicio.

    get:
      tags:
        - Exports
      summary: Listar exportaciones
      operationId: listExports
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Lista de exportaciones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJobList"
        "401":
          description: No autenticado.

  /exports/{export_id}:
    get:
      tags:
        - Exports
      summary: Consultar el estado de una exportación
      operationId: getExport
      parameters:
        - name: export_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Estado de la exportación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
        "401":
          description: No autenticado.
        "404":
          description: Exportación no encontrada.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ExportRequest:
      type: object
      required:
        - entity_type
        - entity_id
        - format
      properties:
        entity_type:
          type: string
          enum:
            - book
            - chapter
            - page
        entity_id:
          type: integer
          minimum: 1
        format:
          type: string
          enum:
            - zip
            - pdf

    ExportJobList:
      type: object
      required:
        - items
        - page
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExportJob"
        page:
          type: integer
        total:
          type: integer

    ExportJob:
      type: object
      required:
        - export_id
        - status
        - created_at
      properties:
        export_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
        download_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        error:
          type: string
