include:
  # Prometheus, Grafana, Loki, Alloy y Jaeger (C3)
  - path: cna/observability/compose.yaml

# Trazas OpenTelemetry hacia Jaeger (OTLP/HTTP). Los servicios arrancan con
# opentelemetry-instrument; sin estas variables no exportan nada.
x-otel: &otel
  OTEL_TRACES_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: healthz,readyz,metrics

services:
  search-index-db:
    image: postgres:16-alpine
    container_name: search-index-db
    env_file:
      - ./cna/deploy/postgres.env
    volumes:
      - search-index-data:/var/lib/postgresql/data
    networks:
      - cna-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  media-svc:
    image: media-svc:2.0.0
    build:
      context: ./cna/services/media-svc
    container_name: media-svc
    env_file:
      - ./cna/services/media-svc/.env
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: media-svc
    ports:
      - "192.168.0.6:8004:8004"
    networks:
      - cna-net
    depends_on:
      nats-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  nats:
    image: nats:2-alpine
    container_name: nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    networks:
      - cna-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Contenedor de una sola vez: crea los streams de JetStream (idempotente).
  # Reutiliza la imagen de event-bridge, que ya trae nats-py.
  nats-init:
    image: event-bridge:2.0.0
    build:
      context: ./cna/services/event-bridge
    command: ["python", "/init/nats_init.py"]
    environment:
      NATS_URL: nats://nats:4222
    volumes:
      - ./cna/deploy/init:/init:ro
    networks:
      - cna-net
    depends_on:
      nats:
        condition: service_healthy
    restart: "no"
    mem_limit: 128m

  # Contenedor de una sola vez: crea los buckets de MinIO (idempotente).
  # Reutiliza la imagen de export-svc, que ya trae boto3.
  minio-init:
    image: export-svc:2.0.0
    build:
      context: ./cna/services/export-svc
    command: ["python", "/init/minio_init.py"]
    env_file:
      - path: ./cna/deploy/minio/.env
        format: raw
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKETS: bookstack-exports,bookstack-media
    volumes:
      - ./cna/deploy/init:/init:ro
    networks:
      - cna-net
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    mem_limit: 128m

  search-svc:
    image: search-svc:2.0.0
    build:
      context: ./cna/services/search-svc
    container_name: search-svc
    env_file:
      - ./cna/services/search-svc/.env
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: search-svc
      BOOKSTACK_TOKEN_FILE: /run/secrets/bookstack/token
    # Token rotable en caliente (cna/security/rotate-bookstack-token.sh)
    volumes:
      - ./cna/deploy/secrets:/run/secrets/bookstack:ro
    ports:
      - "192.168.0.6:8000:8000"
    extra_hosts:
      - "bookstack.local:${BOOKSTACK_HOST_IP:-192.168.100.23}"
    networks:
      - cna-net
    depends_on:
      search-index-db:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Base propia de audit-svc (database per service).
  audit-db:
    image: postgres:16-alpine
    env_file:
      - ./cna/deploy/audit-db.env
    volumes:
      - audit-db-data:/var/lib/postgresql/data
    networks:
      - cna-net
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  audit-svc:
    image: audit-svc:2.0.0
    build:
      context: ./cna/services/audit-svc
    env_file:
      - ./cna/services/audit-svc/.env
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: audit-svc
    ports:
      - "192.168.0.6:8002:8002"
    networks:
      - cna-net
    depends_on:
      audit-db:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cpus: 0.25
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  event-bridge:
    image: event-bridge:2.0.0
    build:
      context: ./cna/services/event-bridge
    container_name: event-bridge
    env_file:
      - ./cna/services/event-bridge/.env
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: event-bridge
    ports:
      - "192.168.0.6:8001:8001"
    networks:
      - cna-net
    depends_on:
      nats-init:
        condition: service_completed_successfully
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: minio
    command: ["server", "/data", "--console-address", ":9001"]
    env_file:
      - path: ./cna/deploy/minio/.env
        format: raw
    volumes:
      - minio-data:/data
    networks:
      - cna-net
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Cola y estado de los jobs de export-svc (AOF: sobrevive a reinicios).
  export-redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - export-redis-data:/data
    networks:
      - cna-net
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # API de exportación: solo encola (202 + job_id). No ejecuta jobs.
  export-svc:
    image: export-svc:2.0.0
    build:
      context: ./cna/services/export-svc
    container_name: export-svc
    env_file:
      - ./cna/services/export-svc/.env
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: export-svc
      BOOKSTACK_TOKEN_FILE: /run/secrets/bookstack/token
    volumes:
      - ./cna/deploy/secrets:/run/secrets/bookstack:ro
    ports:
      - "192.168.0.6:8003:8003"
    extra_hosts:
      - "bookstack.local:${BOOKSTACK_HOST_IP:-192.168.100.23}"
    networks:
      - cna-net
    depends_on:
      export-redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cpus: 0.25
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Worker separado de la API (misma imagen). Sin container_name para
  # poder escalarlo:  docker compose up -d --scale export-worker=3
  export-worker:
    image: export-svc:2.0.0
    build:
      context: ./cna/services/export-svc
    command: ["opentelemetry-instrument", "python", "-m", "app.worker"]
    env_file:
      - ./cna/services/export-svc/.env
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: export-worker
      BOOKSTACK_TOKEN_FILE: /run/secrets/bookstack/token
      # Demora artificial por job, solo para X3 y C2:
      #   EXPORT_SIMULATED_DELAY=20 docker compose up -d export-worker
      EXPORT_SIMULATED_DELAY: ${EXPORT_SIMULATED_DELAY:-0}
    volumes:
      - ./cna/deploy/secrets:/run/secrets/bookstack:ro
    extra_hosts:
      - "bookstack.local:${BOOKSTACK_HOST_IP:-192.168.100.23}"
    networks:
      - cna-net
    depends_on:
      export-redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    # docker stop deja terminar el job en curso antes de salir
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp
    cpus: 0.25
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

# Compose crea volúmenes y red si no existen (CA-7: levanta desde repo limpio).
# Se mantienen los nombres fijos para reutilizar los datos de despliegues previos.
volumes:
  search-index-data:
    external: true
    name: search-index-data
  nats-data:
    external: true
    name: nats-data
  audit-db-data:
    name: audit-db-data
  minio-data:
    name: minio-data
  export-redis-data:
    name: export-redis-data

networks:
  cna-net:
    external: true
    name: cna-net
